<style>
  .risk-blob-button {
    position: fixed;
    z-index: 60;
    bottom: 5vh;
    right: 2vw;
    width: 48px;
    height: 48px;
    background-color: #FF00A8;
    color: white;
    font-size: 7px;
    font-weight: 900;
    text-align: center;
    padding: 4px;
    box-shadow: 0 0 28px rgba(255, 0, 168, 0.55);
    transform: rotate(12deg);
    transition: transform 0.3s ease-out;
    cursor: pointer;
    user-select: none;
    border-radius: 60% 40% 65% 35% / 40% 60% 35% 65%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    line-height: 1.05;
  }
  
  .risk-blob-button::before {
    content: "";
    position: absolute;
    inset: 10%;
    border-radius: inherit;
    border: 3px dashed rgba(255, 255, 255, 0.7);
    mix-blend-mode: screen;
  }
  
  .risk-blob-button:hover {
    transform: rotate(18deg) scale(1.1);
  }
  
  @keyframes risk-blob-vibrate {
    0%, 100% { transform: rotate(12deg) translate(0, 0); }
    10% { transform: rotate(12deg) translate(-1px, 1px); }
    20% { transform: rotate(12deg) translate(1px, -1px); }
    30% { transform: rotate(12deg) translate(-1px, -1px); }
    40% { transform: rotate(12deg) translate(1px, 1px); }
    50% { transform: rotate(12deg) translate(-1px, 0); }
    60% { transform: rotate(12deg) translate(1px, 0); }
    70% { transform: rotate(12deg) translate(0, 1px); }
    80% { transform: rotate(12deg) translate(0, -1px); }
  }
  
  .risk-blob-button {
    animation: risk-blob-vibrate 3.5s infinite;
  }
  
  .risk-blob-button:hover {
    animation: none;
  }
  
  @media (min-width: 768px) {
    .risk-blob-button {
      bottom: auto;
      top: 42vh;
      right: 8vh;
      width: 144px;
      height: 144px;
      font-size: 14px;
      padding: 6px;
    }
  }
  
  @media (prefers-reduced-motion: reduce) {
    .risk-blob-button {
      animation: none;
    }
  }
